aid: egym
name: EGYM
description: 'EGYM is a Munich-headquartered fitness and health technology company that builds
  the connected-gym platform used by commercial fitness operators worldwide: Smart Strength
  and Smart Flex networked equipment, the EGYM Genius AI training engine, the EGYM Fitness Hub
  and Trainer apps, and the EGYM Wellpass / Corporate Fitness membership network that lets
  employers give staff access to thousands of partner venues. For developers, EGYM operates a
  public developer portal at developer.egym.com covering eight machine-readable APIs across
  three integration audiences — member-management-system (MMS) vendors syncing members,
  memberships, RFID/NFC credentials, check-ins, products and trainer tasks into EGYM Cloud;
  equipment vendors submitting body, cardio and flexibility measurements from devices or
  backends; and analytics consumers exporting workout and measurement data. EGYM also
  publishes an official documentation MCP server, an llms.txt, a written AI-agent instruction
  page, a dated change log, published rate limits and a documented webhook event catalog.'
url: https://raw.githubusercontent.com/api-evangelist/egym/refs/heads/main/apis.yml
