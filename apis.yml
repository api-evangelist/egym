apis:
- aid: egym:mms-api-v2
  name: EGYM MMS API V2
  description: 'The current member-management-system integration API. RESTful contract for
    gym management software to sync member accounts and memberships into EGYM Cloud, manage
    profile pictures, RFID and NFC credentials, book EGYM products (Smart Strength, EGYM+),
    push gym check-in / check-out / admission events, create and track trainer tasks, register
    webhook subscriptions, send push notifications to EGYM mobile apps, and migrate members
    from the legacy v1 API. 43 operations across 10 tags.'
