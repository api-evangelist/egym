- aid: egym:mms-api-v1
  name: EGYM MMS API v1
  description: 'The legacy member-management-system API (Gym API v1). Publishes and reads
    member profiles, gym and user products, check-in / check-out events, trainer tasks and a
    liveness endpoint. EGYM documents this API as deprecated for new work — the general-info
    page states that v2 is required for any new project — and the v2 spec ships a /api/v2/migrate
    operation to move accounts off it. 13 operations.'
  humanURL: https://developer.egym.com/mms-api-v2/gymapi/api
  baseURL: https://mms.api.egym.com/v1
