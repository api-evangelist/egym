- aid: egym:user-connect
  name: EGYM User Connect API
  description: 'User-authorized API that lets third-party fitness and wearable apps write a
    member''s own data into their EGYM ID account. Accepts workout submissions and cardio
    measurements — VO2 max, resting heart rate and blood pressure. Authentication is a
    user-scoped EGYM ID JWT that the member can revoke from EGYM ID settings, making this the
    one EGYM surface governed by end-user consent rather than a gym-scoped API key.
    4 operations.'
  humanURL: https://developer.egym.com/user-connect-api/docs/introduction
  baseURL: https://user-connect.api.egym.com/user-connect-api
  tags:
  - Measurements
  - Workouts
  - Consent
  properties:
