- aid: egym:canonical-groupx-classes
  name: EGYM Canonical GroupX Classes API (blueprint)
  description: 'An inverted contract: rather than an API EGYM operates, this is an "API
    blueprint" that EGYM publishes for member-management-system vendors to IMPLEMENT on their
    own hosts, so EGYM''s white-label member app can consume class booking in a uniform way.
    Covers class search, class detail, attendee booking / update / cancellation, waitlist
    add and remove, and an exerciser class schedule. Tagged L2 (read) and L3 (booking)
    conformance levels. The servers[] entry is the templated placeholder
    https://example.org/<partner>/group-classes/v1.0 because the partner supplies the host.
    8 operations.'
  humanURL: https://developer.egym.com/mms-blueprints/canonical-classes
  baseURL: https://developer.egym.com/mms-blueprints/canonical-classes
  tags:
  - Class Booking
  - Blueprint
  - Gym Management
  properties:
  - type: OpenAPI
    url: openapi/egym-canonical-groupx-classes-openapi.yml
  - type: APIReference
    url: https://developer.egym.com/mms-blueprints/canonical-classes
- aid: egym:pay-with-wellpass
  name: EGYM Pay with Wellpass API
  description: 'Authorization-and-capture API for booking platforms. A Wellpass member generates
    a single-use booking code in the Wellpass app for a specific gym; the partner platform
    validates the code (dryRun true), then redeems it (dryRun false), which creates the booking
    and charges the member''s Wellpass credit wallet, returning a payout amount. A cancel
    operation returns credits and is explicitly documented as idempotent. Currently available
    in France and Belgium only. Two operations, documented in prose with a 13-entry typed
    business-error registry — EGYM publishes no OpenAPI for this surface and the base URL is a
    {baseUrl} placeholder issued to partners at onboarding, so no public host exists to record.'
  humanURL: https://developer.egym.com/mms-api-v2/tutorials/pay-with-wellpass
  tags:
  - Payments
  - Corporate Wellness
  - Class Booking
  properties:
  - type: Documentation
    url: https://developer.egym.com/mms-api-v2/tutorials/pay-with-wellpass
  - type: DeclineCodes
    url: errors/egym-decline-codes.yml
  - type: Sandbox
    url: sandbox/egym-sandbox.yml
- aid: egym:mcp-docs
  name: EGYM Documentation MCP Server
  description: 'Official hosted Model Context Protocol server published by EGYM at
    developer.egym.com/mcp and documented on the portal with copy-paste Codex configuration.
    Exposes six tools over the API catalog and documentation corpus — list-apis, get-endpoints,
    get-endpoint-info, get-security-schemes, get-full-api-description and search. The endpoint
    answers tools/list anonymously; an OAuth authorization-server metadata document is served
    at /.well-known/oauth-authorization-server for clients that authenticate.'
  humanURL: https://developer.egym.com/general/ai-agent-integration
  baseURL: https://developer.egym.com/mcp
  tags:
  - MCP
  - AI Agents
  - Documentation
  properties:
