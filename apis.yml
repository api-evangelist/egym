apis:
- aid: egym:pay-with-wellpass
  name: EGYM Pay with Wellpass API
  description: >-
    Authorization-and-capture API for booking platforms. A Wellpass member generates a single-use booking
    code in the Wellpass app for a specific gym; the partner platform validates the code (dryRun true),
    then redeems it (dryRun false), which creates the booking and charges the member's Wellpass credit
    wallet, returning a payout amount. A cancel operation returns credits and is explicitly documented
    as idempotent. Currently available in France and Belgium only. Two operations, documented in prose
    with a 13-entry typed business-error registry — EGYM publishes no OpenAPI for this surface and the
    base URL is a {baseUrl} placeholder issued to partners at onboarding, so no public host exists to
    record.
  humanURL: https://developer.egym.com/mms-api-v2/tutorials/pay-with-wellpass
  tags:
  - Payments
  - Corporate Wellness
  - Class Booking
  properties:
  - type: Documentation
    url: https://developer.egym.com/mms-api-v2/tutorials/pay-with-wellpass
  - type: DeclineCodes
    url: errors/egym-decline-codes.yml
  - type: Sandbox
    url: sandbox/egym-sandbox.yml
- aid: egym:mcp-docs
  name: EGYM Documentation MCP Server
  description: >-
    Official hosted Model Context Protocol server published by EGYM at developer.egym.com/mcp and documented
    on the portal with copy-paste Codex configuration. Exposes six tools over the API catalog and documentation
    corpus — list-apis, get-endpoints, get-endpoint-info, get-security-schemes, get-full-api-description
    and search. The endpoint answers tools/list anonymously; an OAuth authorization-server metadata document
    is served at /.well-known/oauth-authorization-server for clients that authenticate.
  humanURL: https://developer.egym.com/general/ai-agent-integration
  baseURL: https://developer.egym.com/mcp
  tags:
  - MCP
  - AI Agents
  - Documentation
  properties:
