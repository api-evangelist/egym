    url: openapi/egym-data-export-openapi.yml
  - type: Overlay
    url: overlays/egym-data-export-overlay.yaml
- aid: egym:equipment-vendor-standalone
  name: EGYM Equipment Vendor API (standalone clients)
  description: 'Device-to-server API for equipment vendors integrating cardio, strength and
    measurement hardware directly with EGYM Cloud. Covers OAuth token exchange (RFID, NFC
    wallet, encrypted/obfuscated user id, refresh token grants), user profile read/update,
    terms-and-conditions acceptance, RFID assignment, strength / cardio / open-exercise workout
    submission, body / cardio / flexibility measurement submission and history, cardio tests
    and reminders, training plans, activity levels, workout points and machine heartbeat.
    31 operations, the largest EGYM surface.'
  humanURL: https://developer.egym.com/equipment/partner-api
  baseURL: https://partner-api.api.egym.com
  tags:
  - Connected Equipment
  - Measurements
  - Workouts
  - Devices
  properties:
  - type: OpenAPI
    url: openapi/egym-equipment-vendor-standalone-openapi.yml
  - type: APIReference
    url: https://developer.egym.com/equipment/partner-api
  - type: Documentation
    url: https://developer.egym.com/equipment/01-introduction-to-egym-equipment-vendor-apis
  - type: Overlay
    url: overlays/egym-equipment-vendor-standalone-overlay.yaml
- aid: egym:equipment-vendor-server
  name: EGYM Equipment Vendor API (server-to-server)
  description: 'Backend-to-backend API for equipment vendors whose measurement devices report
    through the vendor''s own cloud rather than talking to EGYM directly. Covers OAuth token
    creation with RFID / NFC-wallet / encrypted-user-id grants, a JWKS endpoint, enriched user
    lookup by gym, and body, cardio and flexibility measurement submission. Version 1.1.1 added
    NFC-based login via Apple and Google Wallet. 6 operations.'
  humanURL: https://developer.egym.com/equipment/equipment-vendor-api-server_august-2025
  baseURL: https://b2b-partner-api.ext-1.test.co.egym.coffee
  tags:
