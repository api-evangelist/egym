  - type: Deprecation
    url: https://developer.egym.com/general/general-info
- aid: egym:data-hub
  name: EGYM Data Hub API
  description: 'Analytics and measurement export API for the authenticated gym location.
    Offers six synchronous CSV/JSON export endpoints — general analytics, Smart Strength
    workouts, Smart Strength assessments, flexibility measurements, body measurements and
    opted-out users — plus an asynchronous export-job surface that creates a job and polls its
    status. EGYM documents Data Hub as a pilot available exclusively to Enterprise Pack
    customers, with contracts that may change. 8 operations.'
  humanURL: https://developer.egym.com/data-hub
  baseURL: https://analytics.api.egym.com
  tags:
  - Analytics
  - Data Export
  - Measurements
  - Workouts
