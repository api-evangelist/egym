- aid: egym:data-export
  name: EGYM Data Export API
  description: 'Per-account export API returning a member''s workouts and their strength,
    cardio and body measurements. Marked "Alpha preview" by EGYM. Notable discovery property:
    this API is listed in EGYM''s AI-agent instruction page and is retrievable in full from
    EGYM''s documentation MCP server, but it has no reference page in the HTML documentation
    navigation — it is an MCP-only surface. 4 operations.'
  humanURL: https://developer.egym.com/general/ai-agent-instructions
  baseURL: https://mms.api.egym.com
  tags:
  - Data Export
  - Measurements
  - Workouts
  properties:
