generated: '2026-08-12'
method: searched
source: https://developer.egym.com/mms-api-v2/authentication
docs:
- https://developer.egym.com/mms-api-v2/authentication
- https://developer.egym.com/mms-api-v2/errors
- https://developer.egym.com/mms-api-v2/error-handling
- https://developer.egym.com/mms-api-v2/rate-limits
