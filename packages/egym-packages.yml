summary: 'EGYM publishes no server-side API client SDK for any of its eight REST APIs — there
  is no egym package on npm, PyPI, Maven Central, NuGet, Go modules, RubyGems, Packagist or
  crates.io that wraps the MMS, Data Hub, Equipment Vendor or User Connect APIs. What EGYM does
  publish, under the @egym npm scope, is the toolkit for its Micro Web Application (MWA)
  programme: libraries a partner uses to build a web app that runs INSIDE the EGYM Branded
  Member App. All three are first-party, actively released (all within ten days of this probe),
  and map one-to-one onto repositories in github.com/egym.'

