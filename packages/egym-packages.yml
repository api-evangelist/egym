gaps:
- 'No first-party REST client for MMS API V2 (43 operations), Data Hub, Data Export, either
  Equipment Vendor API or User Connect. Integrators generate their own client or hand-roll HTTP.'
- 'No PyPI, Maven Central, NuGet, Go, RubyGems, Packagist or crates.io presence at all —
  notable because the MMS integration audience is gym management software vendors, who are
  disproportionately .NET and Java shops.'
- 'No CLI. See cli/ — none exists.'
- 'The @egym npm scope is not indexed by the npm search API (scope:egym returns 0 results),
  so the packages are only findable if you already know their exact names from the docs.'
