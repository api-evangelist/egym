governance_split:
  gym_data:
    controller: the gym
    processor: EGYM
    examples: [names, birthdays, contract information, trainer-entered data]
    consent: Not required per-user; covered by the gym contract.
    apis: [MMS API V2, MMS API v1, Data Hub API, Data Export API]
  workout_data:
    controller: the member
    examples: [workout tracking results, health data, training plans]
    consent: 'Member chooses who to share with; revocable in EGYM ID settings.'
    apis: [User Connect API, Equipment Vendor APIs]
    enforcement:
    - getOptedOutUsersExport (Data Hub) so a consumer can honour opt-outs
    - consent-based webhook event filtering, added 2026-06-24
    - eraseAccountMembershipData + MEMBERSHIP_DELETE webhook event
