core_concept: 'EGYM''s data model has one root identity — the EGYM ID, a global account that is
  not scoped to a tenant, brand or gym — and layers gym-scoped context on top of it. The
  developer portal describes the EGYM ID as the account used to log in to EGYM hardware and
  software products and connected equipment. Around it sit two governance buckets that decide
  which API can touch which field: "Gym Data" (processed on behalf of the gym) and "Workout
  Data" (managed on behalf of the member, who controls sharing).'

