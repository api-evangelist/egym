  note: 'Zero here is a finding, not a failure of the crosswalk. EGYM has shipped a
    read-the-docs MCP server, which is a genuine and well-executed agent-readiness move —
    documented install, published agent instructions, anonymous tools/list, real input
    schemas — but it is a discovery surface, not an execution surface. The gap between what
    an agent can learn from EGYM and what an agent can do at EGYM is the whole 117 operations.'

