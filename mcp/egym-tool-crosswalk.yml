summary: 'EGYM''s MCP server and EGYM''s REST APIs are orthogonal surfaces, not two
  projections of one core. The MCP server is a documentation/catalog reader: its six tools
  operate ON the OpenAPI documents and the docs corpus. Not one MCP tool invokes a business
  operation — there is no create-member tool, no submit-measurement tool, no check-in tool.
  So every REST operation is rest_only and every MCP tool is mcp_only in the usual sense of
  the crosswalk. Recording that divergence honestly is the point of this artifact: an agent
  connected to EGYM''s MCP server can learn the entire platform and execute none of it.'

