  /alive:
    post:
      summary: Alive
      description: >
        Notification that the API client is active.

        This method notifies EGYM that the API client is running. Any received
        POST method resets a timestamp when data was last received. This method
        allows to send regular pings and therefore refreshes the timestamp.

        Gym Owners are shown a connectivity status on the EGYM website that is
        changed to inactive if no request is received by any method for 24h -
        therefore best practice would be to send this request at least once per
        day.
      tags:
        - alive
      parameters:
        - in: query
          name: gymId
          description: The id of the gym
          schema:
            type: number
            example: 234
          required: true
      responses:
        '204':
          description: No content
        4XX:
          description: Client Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
