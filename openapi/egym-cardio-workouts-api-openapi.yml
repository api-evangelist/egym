tags:
- name: Cardio Workouts
paths:
  /api/v1/cardio/workouts:
    post:
      tags:
      - Cardio Workouts
      summary: Create Workout
      description: This endpoint creates a cardio workout
      operationId: createWorkout_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardioWorkoutDTO'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
      security:
      - user: []
  /api/v1/cardio/training-plans:
    get:
      tags:
      - Cardio Workouts
      summary: Get Training Plans
      description: This endpoint returns a user cardio training plan
      operationId: findAllTrainingPlans_1
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardioTrainingPlansDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '401':
          description: Unauthorized
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
      security:
      - user: []
components:
  schemas:
    ImageReferenceDTO:
      type: object
      properties:
        imageType:
          type: string
          enum:
          - EXERCISE
          - EQUIPMENT
          - AVATAR
          - COVER
          - GYM_BANNER
          - GYM_PROFILE
          - GYM_HEADER
          - GYM
          - CHART
          - BLOG
          - PARTNER
          - MOBILESPLASH
          - SIGNATURE
          - CARDIOSCAN
          - MUSCLES
          - SHARED
        imageId:
          type: string
    CardioTrainingPlansDTO:
      type: object
      properties:
        trainer:
          type: array
          description: The training plan exercises prescribed by a trainer.
          items:
            $ref: '#/components/schemas/TrainerCardioWorkoutDTO'
        smart:
          type: array
          description: The SMART training plan exercises.
          items:
            $ref: '#/components/schemas/SmartCardioWorkoutDTO'
        genius:
          type: array
          description: The AI (Genius) generated training plan exercises.
          items:
            $ref: '#/components/schemas/GeniusCardioWorkoutDTO'
    GeniusCardioWorkoutDTO:
      type: object
      properties:
        exerciseName:
          type: string
          description: The name that the partner will give to its exercise.
        sessionName:
          type: string
          description: The name that identifies the session for the user.
        startTimestamp:
          type: integer
          format: int64
          description: The start of the exercise in milliseconds since the epoch time.
          example: 1672531200000
        endTimestamp:
          type: integer
          format: int64
          description: The end of the exercise in milliseconds since the epoch time.
        frequency:
          type: integer
          format: int32
          description: The number of times this exercise should be repeated per week.
          example: 2
        timezone:
          type: string
          description: The timezone where the workout is taking place.
        trainingPlanId:
          type: integer
          format: int64
          description: Training Plan ID. When the user selects an exercise from the training plan, this field should contain the training plan id from that exercise when submitting the workout.
          example: 7189234126347912000
        trainingPlanExerciseId:
          type: integer
          format: int64
          description: Training Plan Exercise ID. When the user selects an exercise from the training plan, this field should contain the training plan exercise id from that exercise when submitting the workout.
          example: -767612783462
        orderNumber:
          type: integer
          format: int32
          description: Order number of the exercise in the session of the training plan. This can be used for sorting.
          example: 1
        intervals:
          type: array
          description: The cardio workout intervals.
          items:
            $ref: '#/components/schemas/CardioWorkoutIntervalDTO'
    CardioWorkoutIntervalDTO:
      type: object
      properties:
        rampAngle:
          type: integer
          format: int32
          description: The angle of the ramp.
          example: 1
        resistance:
          type: number
          format: double
          description: The resistance.
          example: 1
        speed:
          type: number
          format: double
          description: The speed in m/s.
          example: '2.7777'
        duration:
          type: integer
          format: int64
          description: The duration in milliseconds.
          example: 5000
        distance:
          type: number
          format: double
          description: The distance in meters.
          example: '13.8'
        heartRate:
          type: integer
          format: int32
          description: The average heart rate of this Interval in beats/min (bpm).
          example: 130
        kiloCalories:
          type: number
          format: double
          description: The kilo calories <b>(kcal)</b> burned during the interval.
          example: 5
        stepsPerMinute:
          type: integer
          format: int32
          description: The steps per minutes.
          example: 70
        steps:
          type: integer
          format: int32
          description: The number of steps during the interval.
          example: 10
        stepHeight:
          type: integer
          format: int32
          description: The step height.
          example: 2
        strideLengthZone:
          type: integer
          format: int32
          description: The stride length zone.
          example: 1
        rotations:
          type: integer
          format: int32
          description: The rotations, in rotations per minute (rpm).
          example: 50
        incline:
          type: number
          format: double
          description: The incline.
          example: '1.5'
        floors:
          type: integer
          format: int32
          description: The floors.
          example: 1
        watts:
          type: number
          format: double
          description: Power/Resistance in watts.
          example: 200
    SmartCardioWorkoutDTO:
      type: object
      properties:
        startTimestamp:
          type: integer
          format: int64
          description: The start of the exercise in milliseconds since the epoch time.
          example: 1672531200000
        endTimestamp:
          type: integer
          format: int64
          description: The end of the exercise in milliseconds since the epoch time.
        frequency:
          type: integer
          format: int32
          description: The number of times this exercise should be repeated per week.
          example: 2
        timezone:
          type: string
          description: The timezone where the workout is taking place.
        trainingPlanId:
          type: integer
          format: int64
          description: Training Plan ID. When the user selects an exercise from the training plan, this field should contain the training plan id from that exercise when submitting the workout.
          example: 7189234126347912000
        trainingPlanExerciseId:
          type: integer
          format: int64
          description: Training Plan Exercise ID. When the user selects an exercise from the training plan, this field should contain the training plan exercise id from that exercise when submitting the workout.
          example: -767612783462
        orderNumber:
          type: integer
          format: int32
          description: Order number of the exercise in the session of the training plan. This can be used for sorting.
          example: 1
        smartExerciseName:
          type: string
          description: Exercise name.
          enum:
          - BOOST_METABOLISM
          - GET_LEAN
          - CARDIO_VARIETY
          - BASELINE_ENDURANCE
          - FASTER_REGENERATION
          - GET_FASTER
          - HIGH_END_ENDURANCE
          - INCREASE_BLOOD_FLOW
          - COME_BACK
          - WARM_UP
          - COOL_DOWN
          - COMBINED_CARDIO
          - ONLY_CARDIO
          - MIGROS_POTENTIAL_1
          - MIGROS_POTENTIAL_2
          - MIGROS_EXHAUSTION_1
          - MIGROS_EXHAUSTION_2
          - MIGROS_RESISTANCE_TO_TIRED_1
          - MIGROS_RESISTANCE_TO_TIRED_2
        intensity:
          type: string
          description: Exercise intensity.
          enum:
          - VERY_HIGH
          - HIGH
          - MODERATE
          - LIGHT
          - VERY_LIGHT
        smartTrainingMethod:
          type: string
          description: Smart Workout Training Method.
          enum:
          - CONTINUOUS
          - INTERVAL
          - HILL
          - VARIETY
          - PYRAMID
        trainingGoal:
          type: string
          deprecated: true
          description: The user training goal.
          enum:
          - WEIGHT_LOSS
          - FITNESS
          - MUSCLE_GAIN
          - BBP
          - BBP_AND_WEIGHT_LOSS
          - SPINAL
          - REHASPORT
        trainingProgram:
          type: string
          description: The user training program.
          enum:
          - WEIGHT_LOSS
          - FITNESS
          - MUSCLE_GAIN
          - BBP
          - BBP_AND_WEIGHT_LOSS
          - REHASPORT
          - IMMUNITY
        intervals:
          type: array
          description: The smart cardio workout intervals.
          items:
            $ref: '#/components/schemas/CardioWorkoutIntervalDTO'
    FieldErrorDTO:
      type: object
      properties:
        name:
          type: string
          description: The field name.
        message:
          type: string
          description: The error message.
          example: Must not be null.
        rejectedValue:
          description: The rejected value.
          example: Must not be null.
    UserDTO:
      type: object
      properties:
        userId:
          type: string
          description: The userId assigned by EGYM, for example -1c2yqo37vn9m. Can be null on xID authentication if BMA User is not linked to EGYM account.
          example: -1c2yqo37vn9m
        bmaUserId:
          type: string
          description: Temporary solution for Matrix. The BMA userId assigned by egym, for example d101df00-ab9d-40f5-8f03-3c50aaa364d6. Only available during xID authentication
          example: d101df01-ab9d-40f5-8f03-3c50aaa364d6
        firstName:
          type: string
          description: The user's first name.
        lastName:
          type: string
          description: The user's last name.
        image:
          $ref: '#/components/schemas/ImageReferenceDTO'
          description: The user profile image.
      required:
      - firstName
    CardioWorkoutDTO:
      type: object
      properties:
        uniqueExerciseId:
          type: string
          description: Unique identifier for this exercise. The machine should generate a unique id for each exercise submitted.
          minLength: 1
        startTimestamp:
          type: integer
          format: int64
          description: The start of the exercise in milliseconds since the epoch time. It can not be older than seven days.
          example: 1672531200000
        endTimestamp:
          type: integer
          format: int64
          description: The end of the exercise in milliseconds since the epoch time.
        timezone:
          type: string
          description: The timezone where the workout is taking place.
        frequency:
          type: integer
          format: int32
          description: The number of times this exercise should be repeated per week.
          example: 2
        exerciseName:
          type: string
          description: The name that the partner will give to its exercise.
          minLength: 1
        kiloCalories:
          type: number
          format: double
          description: The kilo calories <b>(kcal)</b> burned during the exercise.
          example: 100
        averageHeartRate:
          type: integer
          format: int32
          description: The average heart rate of this workout in <b>beats/min (bpm)</b>.
        trainingPlanId:
          type: integer
          format: int64
          description: Training Plan ID. When the user selects an exercise from the training plan, this field should contain the training plan id from that exercise when submitting the workout.
          example: 7189234126347912000
        averagePace:
          type: number
          format: double
          description: the average pace of this workout in min/km
        trainingPlanExerciseId:
          type: integer
          format: int64
          description: Training Plan Exercise ID. When the user selects an exercise from the training plan, this field should contain the training plan exercise id from that exercise when submitting the workout.
          example: -767612783462
        orderNumber:
          type: integer
          format: int32
          description: Order number of the exercise in the session of the training plan. This can be used for sorting.
          example: 1
        metadata:
          type: object
          additionalProperties:
            type: string
          description: The workout's metadata as key-value pairs.
        intervals:
          type: array
          description: The cardio workout intervals (sets of exercises).
          items:
            $ref: '#/components/schemas/CardioWorkoutIntervalDTO'
          minItems: 1
      required:
      - exerciseName
      - intervals
      - startTimestamp
      - uniqueExerciseId
    TrainerCardioWorkoutDTO:
      type: object
      properties:
        author:
          $ref: '#/components/schemas/UserDTO'
          description: Information about the author of the workout.
        exerciseName:
          type: string
          description: The name that the partner will give to its exercise.
        sessionName:
          type: string
          description: The name that the trainer will give to their exercise.
        startTimestamp:
          type: integer
          format: int64
          description: The start of the exercise in milliseconds since the epoch time.
          example: 1672531200000
        endTimestamp:
          type: integer
          format: int64
          description: The end of the exercise in milliseconds since the epoch time.
        frequency:
          type: integer
          format: int32
          description: The number of times this exercise should be repeated per week.
          example: 2
        timezone:
          type: string
          description: The timezone where the workout is taking place.
        trainingPlanId:
          type: integer
          format: int64
          description: Training Plan ID. When the user selects an exercise from the training plan, this field should contain the training plan id from that exercise when submitting the workout.
          example: 7189234126347912000
        trainingPlanExerciseId:
          type: integer
          format: int64
          description: Training Plan Exercise ID. When the user selects an exercise from the training plan, this field should contain the training plan exercise id from that exercise when submitting the workout.
          example: -767612783462
        orderNumber:
          type: integer
          format: int32
          description: Order number of the exercise in the session of the training plan. This can be used for sorting.
          example: 1
        intervals:
          type: array
          description: The trainer cardio workout intervals.
          items:
            $ref: '#/components/schemas/CardioWorkoutIntervalDTO'
    ApiErrorResponseDTO:
      type: object
      description: Standard error response returned by the API for all error status codes.
      properties:
        timestamp:
          type: integer
          format: int64
          description: Unix epoch milliseconds when the error occurred.
          example: 1775122463109
        path:
          type: string
          description: The request path that triggered the error.
          example: /api/v1/measurements/body/history
        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400
        error:
          type: string
          description: Short textual description of the HTTP status.
          example: Bad Request
        requestId:
          type: string
          description: Unique identifier for the request, useful for correlating logs and support tickets.
          example: d0c0fd9e-236
        message:
          type: string
          description: Human-readable description of the error.
          example: 'Invalid request parameters: value must be greater than or equal to 1 and less than or equal to 1000'
        fieldErrors:
          type: array
          description: List of field-level validation errors. Only present when the error was caused by request-body binding failures or custom form validation.
          items:
            $ref: '#/components/schemas/FieldErrorDTO'
        errorCode:
          type: string
          description: Machine-readable error code for domain-specific errors. Only present for exceptions that carry a custom error code.
          example: USER_NOT_FOUND
  securitySchemes:
    user:
      type: http
      scheme: bearer
      bearerFormat: JWT
    partner:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth/token
          scopes: {}
