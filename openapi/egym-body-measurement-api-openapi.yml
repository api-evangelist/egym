  /api/v1/measurements/body/history:
    get:
      tags:
      - Body Measurement
      summary: Get Body History for a user
      description: This endpoint retrieves body measurements history for the user with pagination support
      operationId: getUserBodyHistory
      parameters:
      - name: lastId
        in: query
        description: Cursor for keyset pagination. When provided, only measurements with an ID strictly less than this value are returned, allowing the client to page backwards through the history. Omit on the first request.
        required: false
        schema:
          type: integer
          format: int64
      - name: measurementLimit
        in: query
        description: Maximum number of measurements to return. Must be a positive integer. When omitted, the server applies its default limit.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BodyMeasurementHistoryResponseDTO'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '401':
          description: Unauthorized
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
      security:
      - user: []
    servers:
    - url: https://partner-api.ext-1.test.co.egym.coffee
      description: Test (ext-1)
    - url: https://partner-api.api.egym.com
      description: Production
components:
  schemas:
    ErrorDTO:
      type: object
      properties:
        timestamp:
          type: string
          description: The timestamp of the request.
          format: date-time
        path:
          type: string
          description: The path requested.
        requestId:
          type: string
          description: The request ID.
          example: de625cf1-1
        status:
          type: integer
          description: The http status code.
          format: int32
        error:
          type: string
          description: The error.
        message:
          type: string
          description: The message to describe the error.
        fieldErrors:
          type: array
          description: The constraint violations.
          items:
            $ref: '#/components/schemas/FieldErrorDTO'
    MeasurementDTO:
      required:
      - data
      - gymId
      - machineName
      - timestamp
      - uniqueMeasurementId
      type: object
      properties:
        timestamp:
          type: integer
          description: The timestamp of when the measurement took place in milliseconds since the epoch time.
          format: int64
          example: 1553074207520
        machineName:
          type: string
          description: The machine name of the equipment that generates the measurement. Machine name needs to be registered at EGYM.
          example: device123
        gymId:
          type: integer
          description: The EGYM Gym Location ID.
          format: int64
          example: 130
        uniqueMeasurementId:
          type: string
          description: Unique identifier for this measurement. The machine should generate a unique id for each measurement submitted.
