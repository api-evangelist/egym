tags:
- name: Resource
paths:
  /api/v1/resources/terms-and-conditions:
    get:
      tags:
      - Resource
      summary: Terms and Conditions
      description: This endpoint returns the EGYM terms and conditions
      operationId: getTermsAndConditions
      parameters:
      - name: locale
        in: query
        description: Provide the locale in ISO 15897 standard format.
        required: true
        schema:
          type: string
        example: en_US
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                format: byte
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
      security: []
  /api/v1/resources/privacy-policy:
    get:
      tags:
      - Resource
      summary: Privacy Policy
      description: This endpoint returns the EGYM privacy policy
      operationId: getPrivacyPolicy
      parameters:
      - name: locale
        in: query
        description: Provide the locale in ISO 15897 standard format.
        required: true
        schema:
          type: string
        example: en_US
      responses:
        '200':
          description: OK
          content:
            text/html:
              schema:
                type: string
                format: byte
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponseDTO'
      security: []
components:
  schemas:
    FieldErrorDTO:
      type: object
      properties:
        name:
          type: string
          description: The field name.
        message:
          type: string
          description: The error message.
          example: Must not be null.
        rejectedValue:
          description: The rejected value.
          example: Must not be null.
    ApiErrorResponseDTO:
      type: object
      description: Standard error response returned by the API for all error status codes.
      properties:
        timestamp:
          type: integer
          format: int64
          description: Unix epoch milliseconds when the error occurred.
          example: 1775122463109
        path:
          type: string
          description: The request path that triggered the error.
          example: /api/v1/measurements/body/history
        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 400
        error:
          type: string
          description: Short textual description of the HTTP status.
          example: Bad Request
        requestId:
          type: string
          description: Unique identifier for the request, useful for correlating logs and support tickets.
          example: d0c0fd9e-236
        message:
          type: string
          description: Human-readable description of the error.
          example: 'Invalid request parameters: value must be greater than or equal to 1 and less than or equal to 1000'
        fieldErrors:
          type: array
          description: List of field-level validation errors. Only present when the error was caused by request-body binding failures or custom form validation.
          items:
            $ref: '#/components/schemas/FieldErrorDTO'
        errorCode:
          type: string
          description: Machine-readable error code for domain-specific errors. Only present for exceptions that carry a custom error code.
          example: USER_NOT_FOUND
  securitySchemes:
    user:
      type: http
      scheme: bearer
      bearerFormat: JWT
    partner:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth/token
          scopes: {}
