gaps:
- No response uses application/problem+json, so RFC 9457 client tooling cannot parse EGYM errors generically.
- The Canonical GroupX Classes blueprint declares 422 responses with cause/reason semantics but attaches no schema
  and no media type, so an implementing partner has no machine-readable contract for the error body it is expected
  to return.
- MMS API v1 collapses every failure into a single 4XX range response rather than enumerating status codes.
- No 429 response is declared in any OpenAPI document even though MMS API V2 documents a 429 rate-limit response
  in prose.
